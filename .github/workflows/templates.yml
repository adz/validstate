name: Templates

on:
  push:
    branches:
      - main
    tags:
      - 'templates-v*.*.*'
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # Generates a project from each template and proves it builds, passes its tests and self-tests as NativeAOT.
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # fontconfig for SkiaSharp in the headless UI tests; clang and zlib for NativeAOT.
      - name: Install native prerequisites
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1 clang zlib1g-dev

      - name: Pack and install the templates
        run: |
          dotnet pack templates/Validstate.Templates.proj -o artifacts
          dotnet new install artifacts/Validstate.Templates.*.nupkg

      - name: Generate a project
        run: |
          mkdir -p generated && cd generated
          dotnet new validstate-app -n DemoTool --publisher "Template CI" --repository adz/demotool

      - name: Build and test the generated project
        working-directory: generated/DemoTool
        run: |
          dotnet build DemoTool.slnx --configuration Release --nologo -v minimal -m:1
          dotnet test --project tests/DemoTool.Tests/DemoTool.Tests.fsproj --configuration Release --no-build

      - name: NativeAOT self-test of the generated project
        working-directory: generated/DemoTool
        run: |
          bash scripts/publish.sh --rid linux-x64 --output artifacts/publish/linux-x64
          artifacts/publish/linux-x64/demotool --self-test

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: templates-package
          path: artifacts/*.nupkg

  # A templates-vX.Y.Z tag publishes Validstate.Templates to NuGet. Needs repository secret NUGET_API_KEY.
  publish:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/templates-v')
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Pack with the tag's version
        run: dotnet pack templates/Validstate.Templates.proj -o artifacts -p:Version=${GITHUB_REF_NAME#templates-v}

      - name: Push to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
